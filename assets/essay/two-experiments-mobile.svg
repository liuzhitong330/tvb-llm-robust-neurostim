<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 477" role="img" aria-labelledby="title desc"><title id="title">Two different kinds of control</title><desc id="desc">Both comparisons share a zero-to-0.6 axis. Intrinsic: 0.5285 to 0.3182. External current: 0.5285 to 0.5194.</desc><g font-family="Arial, Helvetica, sans-serif"><text x="12" y="24" font-size="19" fill="#292629" text-anchor="start" >A · Intrinsic model control</text><text x="12" y="49" font-size="16" fill="#695575" text-anchor="start" >39.8% lower proxy score</text><text x="12" y="78" font-size="15" fill="#69636a" text-anchor="start" >Baseline</text><rect x="12" y="87" width="290.675" height="21" fill="#b3abae"/><text x="312.675" y="103" font-size="15" fill="#b3abae" text-anchor="start" >0.5285</text><text x="12" y="142" font-size="15" fill="#69636a" text-anchor="start" >Selected setting</text><rect x="12" y="151" width="175.01" height="21" fill="#695575"/><text x="197.01" y="167" font-size="15" fill="#695575" text-anchor="start" >0.3182</text><line x1="12" y1="191" x2="342" y2="191" stroke="#d8d2d7" stroke-width="1" /><text x="12.0" y="210" font-size="13" fill="#69636a" text-anchor="middle" >0.0</text><text x="122.00000000000001" y="210" font-size="13" fill="#69636a" text-anchor="middle" >0.2</text><text x="232.00000000000003" y="210" font-size="13" fill="#69636a" text-anchor="middle" >0.4</text><text x="342.0" y="210" font-size="13" fill="#69636a" text-anchor="middle" >0.6</text><text x="12" y="244" font-size="19" fill="#292629" text-anchor="start" >B · External-current stimulation</text><text x="12" y="269" font-size="16" fill="#a35135" text-anchor="start" >1.7% lower proxy score</text><text x="12" y="298" font-size="15" fill="#69636a" text-anchor="start" >Baseline</text><rect x="12" y="307" width="290.675" height="21" fill="#b3abae"/><text x="312.675" y="323" font-size="15" fill="#b3abae" text-anchor="start" >0.5285</text><text x="12" y="362" font-size="15" fill="#69636a" text-anchor="start" >Selected setting</text><rect x="12" y="371" width="285.6506489409525" height="21" fill="#a35135"/><text x="307.6506489409525" y="387" font-size="15" fill="#a35135" text-anchor="start" >0.5194</text><line x1="12" y1="411" x2="342" y2="411" stroke="#d8d2d7" stroke-width="1" /><text x="12.0" y="430" font-size="13" fill="#69636a" text-anchor="middle" >0.0</text><text x="122.00000000000001" y="430" font-size="13" fill="#69636a" text-anchor="middle" >0.2</text><text x="232.00000000000003" y="430" font-size="13" fill="#69636a" text-anchor="middle" >0.4</text><text x="342.0" y="430" font-size="13" fill="#69636a" text-anchor="middle" >0.6</text><text x="12" y="461" font-size="15" fill="#69636a" text-anchor="start" >Activity variance · lower is better</text></g></svg>