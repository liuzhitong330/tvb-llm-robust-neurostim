<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 470" role="img" aria-labelledby="title desc"><title id="title">Two different kinds of control produce different gains</title><desc id="desc">Intrinsic: 0.5285 to 0.3182, reported 39.8% reduction. External current: 0.5285 to 0.5194, 1.7% reduction. Positive variance scores are the negatives of the archived rewards. The two plots share one scale.</desc><g font-family="Arial, Helvetica, sans-serif"><line x1="195.0" y1="75" x2="195.0" y2="350" stroke="#d8d2d7" stroke-width="1" /><text x="195.0" y="385" font-size="14" fill="#69636a" text-anchor="middle" >0.0</text><line x1="385.0" y1="75" x2="385.0" y2="350" stroke="#d8d2d7" stroke-width="1" /><text x="385.0" y="385" font-size="14" fill="#69636a" text-anchor="middle" >0.2</text><line x1="575.0" y1="75" x2="575.0" y2="350" stroke="#d8d2d7" stroke-width="1" /><text x="575.0" y="385" font-size="14" fill="#69636a" text-anchor="middle" >0.4</text><line x1="765.0" y1="75" x2="765.0" y2="350" stroke="#d8d2d7" stroke-width="1" /><text x="765.0" y="385" font-size="14" fill="#69636a" text-anchor="middle" >0.6</text><text x="0" y="27" font-size="19" fill="#292629" text-anchor="start" >A  ·  Intrinsic model control</text><text x="0" y="51" font-size="14" fill="#69636a" text-anchor="start" >Change epileptogenicity and coupling</text><text x="0" y="230" font-size="19" fill="#292629" text-anchor="start" >B  ·  External-current stimulation</text><text x="0" y="254" font-size="14" fill="#69636a" text-anchor="start" >Add a current offset at one region</text><text x="0" y="105" font-size="15" fill="#69636a" text-anchor="start" >Baseline</text><rect x="195" y="88" width="502.07500000000005" height="24" fill="#b3abae"/><text x="709.075" y="105" font-size="16" fill="#b3abae" text-anchor="start" >0.5285</text><text x="0" y="155" font-size="15" fill="#69636a" text-anchor="start" >Selected setting</text><rect x="195" y="138" width="302.29" height="24" fill="#695575"/><text x="509.29" y="155" font-size="16" fill="#695575" text-anchor="start" >0.3182</text><text x="0" y="301" font-size="15" fill="#69636a" text-anchor="start" >No stimulation</text><rect x="195" y="284" width="502.07500000000005" height="24" fill="#b3abae"/><text x="709.075" y="301" font-size="16" fill="#b3abae" text-anchor="start" >0.5285</text><text x="0" y="351" font-size="15" fill="#69636a" text-anchor="start" >Right hippocampus</text><rect x="195" y="334" width="493.39657544346346" height="24" fill="#a35135"/><text x="700.3965754434635" y="351" font-size="16" fill="#a35135" text-anchor="start" >0.5194</text><text x="195" y="199" font-size="16" fill="#695575" text-anchor="start" >39.8% lower worst-case proxy score</text><text x="195" y="417" font-size="16" fill="#a35135" text-anchor="start" >1.7% lower worst-case proxy score</text><text x="195" y="455" font-size="14" fill="#69636a" text-anchor="start" >Simulated activity variance · lower is better</text></g></svg>